name: Deploy Estate Portal (albertlane.org)

# Authored: Albert Lane | SEC Whistleblower No. 17684-273-411-436
# Deploys the estate-portal Worker to albertlane.org via Cloudflare Workers.
# Fixes error 1016: Worker serves at the edge, no origin server required.

on:
  push:
    branches: [main]
    paths:
      - 'workers/estate-portal.ts'
      - 'wrangler.estate-portal.toml'
      - 'package.estate-portal.json'
      - 'tsconfig.estate-portal.json'
      - '.github/workflows/deploy-estate-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy estate-portal → albertlane.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install Worker toolchain
        run: |
          npm install --no-save --legacy-peer-deps \
            wrangler@3.72.2 \
            @cloudflare/workers-types@4.20260702.1 \
            typescript@5.5.4

      - name: Type-check Worker
        run: npx tsc --noEmit -p tsconfig.estate-portal.json

      - name: Clear conflicting routes on albertlane.org zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID="ecc4cc0dae965e2179c6b87797a5da24"
          echo "Fetching routes for zone $ZONE_ID..."
          ROUTES=$(curl -s -X GET \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/workers/routes" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json")
          echo "Routes: $ROUTES"
          # Delete every route whose pattern matches albertlane.org/*
          echo "$ROUTES" | python3 -c "
import json, sys, urllib.request, os
data = json.load(sys.stdin)
token = os.environ['CLOUDFLARE_API_TOKEN']
zone_id = 'ecc4cc0dae965e2179c6b87797a5da24'
for route in data.get('result', []):
    if route.get('pattern') == 'albertlane.org/*':
        rid = route['id']
        script = route.get('script', '(none)')
        print(f'Deleting route {rid} (assigned to: {script})')
        req = urllib.request.Request(
            f'https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes/{rid}',
            method='DELETE',
            headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}
        )
        with urllib.request.urlopen(req) as r:
            print(r.read().decode())
        print(f'Deleted route {rid}')
print('Route cleanup complete')
"

      - name: Deploy to albertlane.org
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "6307afab302548753f4d336bb7a10188"
        run: npx wrangler deploy --config wrangler.estate-portal.toml --minify
